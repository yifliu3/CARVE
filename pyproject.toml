[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carve"
version = "4.0.0"
description = "CARVE: Proxy-Guided Causal Diffusion Rendering with Coding Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff>=0.16"]
demo = ["trimesh==4.7.4", "playwright==1.63.0"]

[project.scripts]
carve = "carve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carve = ["prompts/*.txt", "assets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/carve/layout.py" = ["F401"]
